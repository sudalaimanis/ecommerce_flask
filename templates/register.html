{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h1 class="section-title" style="font-size:1.75rem">Create account</h1>
<form method="post" class="form-stack" style="max-width:420px">
  <label for="name">Name</label>
  <input type="text" id="name" name="name" required autocomplete="name">

  <label for="email">Email</label>
  <input type="email" id="email" name="email" required autocomplete="email">

  <label for="password">Password (min 6 characters)</label>
  <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">

  <button type="submit" class="btn btn-primary">Register</button>
</form>
<p class="meta" style="margin-top:1.25rem">Already have an account? <a href="{{ url_for('main.login') }}">Log in</a></p>
{% endblock %}
