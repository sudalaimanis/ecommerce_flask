{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1 class="section-title" style="font-size:1.75rem">Log in</h1>
<form method="post" class="form-stack" style="max-width:420px">
  <label for="email">Email</label>
  <input type="email" id="email" name="email" required autocomplete="username">

  <label for="password">Password</label>
  <input type="password" id="password" name="password" required autocomplete="current-password">

  <button type="submit" class="btn btn-primary">Log in</button>
</form>
<p class="meta" style="margin-top:1.25rem">No account? <a href="{{ url_for('main.register') }}">Register</a></p>
{% endblock %}
