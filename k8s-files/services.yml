            - {name: REDIS_URL, value: "redis://redis:6379/0"}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: shop-secrets, key: JWT_SECRET}}
            - {name: DATABASE_URL, value: "postgresql+psycopg2://shop:$(POSTGRES_PASSWORD)@postgres:5432/user_db"}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
