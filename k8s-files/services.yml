# Application services. Image tags are rewritten by the Jenkins pipeline on each build.
# NOTE: keep backend replicas at 1 - events use Redis pub/sub, so extra replicas would each handle every event.
# Only `web` is stateless and can be scaled freely.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: sudalaimmanis/flaskapp-web:latest
          ports: [{containerPort: 5000}]
          env:
            - {name: REDIS_URL, value: "redis://redis:6379/0"}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: shop-secrets, key: JWT_SECRET}}
            - name: SECRET_KEY
              valueFrom: {secretKeyRef: {name: shop-secrets, key: SECRET_KEY}}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: LoadBalancer
  selector: {app: web}
  ports: [{port: 80, targetPort: 5000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 1
